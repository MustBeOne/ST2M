[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st2m"
description = "Source code implementary of ST2M"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy", 
    "torch", 
    "pandas", 
    "tqdm", 
    "pymatgen", 
    "pyxtal"]

[project.optional-dependencies]
validation = ["mace-torch", "chgnet"]

[project.scripts]
st2m-train = "st2m.train:main"
st2m-generate = "st2m.generate:main"
st2m-generate-steps = "st2m.generate_steps:main"
st2m-generate-new-pattern = "st2m.generate_new_pattern:main"
st2m-process-mp20 = "st2m.preprocessing.dataset_process_mp20:main"
st2m-sample-new-pattern = "st2m.postproc.sample_new_pattern:main"
st2m-extract = "st2m.postproc.extract_from_tensor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["st2m*"]

[tool.setuptools.package-data]
"st2m.utils" = ["mask_temp.pt"]
